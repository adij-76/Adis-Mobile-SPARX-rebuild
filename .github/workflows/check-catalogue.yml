name: Check migration catalogue

# Keeps docs/db-migration-catalogue.md (the "migrate production here" bible) in
# lock-step with db/*.sql: fails if a SQL file or a mobile_* object isn't
# documented. Runs on every DB/doc change, on a daily schedule (so drift is
# caught even without a related code change), and on demand. Pure file check —
# no DB access or secrets.

on:
  schedule:
    - cron: '0 13 * * *' # daily, 13:00 UTC
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'docs/db-migration-catalogue.md'
      - 'scripts/check-migration-catalogue.mjs'
      - '.github/workflows/check-catalogue.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'docs/db-migration-catalogue.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check catalogue is current
        run: node scripts/check-migration-catalogue.mjs
