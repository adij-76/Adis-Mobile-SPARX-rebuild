name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys: queue overlapping runs instead of cancelling them.
# cancel-in-progress:true made concurrent deploys supersede each other, which
# surfaced as "Deployment cancelled" failures when several merges landed close
# together. Queuing lets each deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npx expo export --platform web
        env:
          # Served from https://<user>.github.io/Adis-Mobile-SPARX-rebuild/
          EXPO_PUBLIC_BASE_URL: /Adis-Mobile-SPARX-rebuild
          # Optional: set repo variable SPARKY_WEBHOOK to connect Sparky to n8n.
          EXPO_PUBLIC_SPARKY_WEBHOOK: ${{ vars.SPARKY_WEBHOOK }}
          # Optional: set these two repo variables to serve content from Supabase.
          # Until both are set, the app falls back to local mock content.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Disable Jekyll (serve _expo/ and _sitemap)
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Use whichever attempt succeeded (retry falls back if the first flaked).
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # GitHub Pages' publish step intermittently returns "Deployment failed, try
      # again later" even when the build + artifact are fine. Attempt once, and if
      # only that transient hit, wait and retry once automatically instead of
      # needing a manual re-run. No third-party actions.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
