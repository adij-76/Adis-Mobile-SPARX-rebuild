name: Apply DB migrations

# Applies the SQL layer to Supabase so you review via PR and it runs itself on
# merge — no more copy-paste into the SQL editor.
#
#   • On merge to main touching db/**: applies the recreatable structural layer
#     in db/apply-order.txt (idempotent, dependency-ordered).
#   • Manual run (workflow_dispatch): apply ONE file (e.g. a data seed or the
#     auth import) by naming it in the `file` input.
#
# Requires one repo secret: SUPABASE_DB_URL — a Postgres connection string for
# your project. Use the SESSION POOLER string, NOT the direct connection:
#   Supabase → Settings → Database → Connection string → "Session pooler".
#   It looks like:
#     postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# Why not the direct connection (db.<ref>.supabase.co:5432)? It's IPv6-only, and
# GitHub Actions runners are IPv4-only — the direct host is simply unreachable
# from a runner ("Network is unreachable"). The session pooler is IPv4 and runs
# in SESSION mode (port 5432), so multi-statement DDL / functions apply cleanly
# (the transaction pooler on 6543 does NOT — avoid it for migrations).
# Until the secret is set, this workflow skips gracefully. It never runs on pull
# requests (only merged code applies).

on:
  push:
    branches: [main]
    paths:
      - 'db/**'
      - '.github/workflows/apply-migrations.yml'
  workflow_dispatch:
    inputs:
      file:
        description: 'A single db/ file to apply (e.g. problems-seed.sql). Blank = apply the full apply-order manifest.'
        required: false
        default: ''

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure psql
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      # TEMP DIAGNOSTIC — prints the SHAPE of the connection string (never the
      # password). Remove once the connection is confirmed. Only runs on non-main
      # refs (i.e. when dispatched against a feature branch), never on main.
      - name: Debug connection shape
        if: ${{ github.ref_name != 'main' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse as u
          raw = os.environ.get("SUPABASE_DB_URL", "")
          print("raw length:", len(raw))
          print("has leading/trailing whitespace:", raw != raw.strip())
          print("newline count:", raw.count("\n"))
          p = u.urlparse(raw.strip())
          print("scheme:", p.scheme)
          print("username:", p.username)
          print("host:", p.hostname)
          print("port:", p.port)
          print("dbname:", p.path)
          pw = p.password or ""
          print("password length:", len(pw))
          print("password isalnum:", pw.isalnum())
          PY

      - name: Apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice::SUPABASE_DB_URL secret not set — skipping. Add it in Settings → Secrets and variables → Actions to enable auto-apply."
            exit 0
          fi

          # Build the ordered file list (single file, or the manifest).
          files=()
          if [ -n "${INPUT_FILE:-}" ]; then
            if [ ! -f "db/$INPUT_FILE" ]; then echo "::error::db/$INPUT_FILE not found"; exit 1; fi
            files+=("$INPUT_FILE")
          else
            while IFS= read -r line; do
              f="$(echo "$line" | sed 's/#.*//' | xargs || true)"   # strip comments/whitespace
              [ -z "$f" ] && continue
              if [ ! -f "db/$f" ]; then echo "::error::db/$f not found"; exit 1; fi
              files+=("$f")
            done < db/apply-order.txt
          fi

          # Emit one psql script that applies every file over a SINGLE connection
          # (\i includes), so we log in once instead of once-per-file. This avoids
          # the transient "password authentication failed" that Supabase's pooler
          # (Supavisor) can return on some connections in the minutes after a DB
          # password reset, while its backend nodes converge on the new credential.
          stream() {
            for f in "${files[@]}"; do
              printf '\\echo == applying db/%s ==\n\\i db/%s\n' "$f" "$f"
            done
          }

          # Retry the whole apply a few times with backoff — covers any residual
          # pooler propagation lag right after a password change.
          attempt=1; max=5
          until stream | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q; do
            code=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::psql failed after $max attempts (exit $code)."
              exit "$code"
            fi
            wait=$((attempt * 10))
            echo "::warning::apply attempt $attempt failed (exit $code); retrying in ${wait}s…"
            sleep "$wait"
            attempt=$((attempt + 1))
          done
          echo "✓ Migrations applied."
