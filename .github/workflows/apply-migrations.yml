name: Apply DB migrations

# Applies the SQL layer to Supabase so you review via PR and it runs itself on
# merge — no more copy-paste into the SQL editor.
#
#   • On merge to main touching db/**: applies the recreatable structural layer
#     in db/apply-order.txt (idempotent, dependency-ordered).
#   • Manual run (workflow_dispatch): apply ONE file (e.g. a data seed or the
#     auth import) by naming it in the `file` input.
#
# Requires one repo secret: SUPABASE_DB_URL — a Postgres connection string for
# your project. Use the SESSION POOLER string, NOT the direct connection:
#   Supabase → Settings → Database → Connection string → "Session pooler".
#   It looks like:
#     postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# Why not the direct connection (db.<ref>.supabase.co:5432)? It's IPv6-only, and
# GitHub Actions runners are IPv4-only — the direct host is simply unreachable
# from a runner ("Network is unreachable"). The session pooler is IPv4 and runs
# in SESSION mode (port 5432), so multi-statement DDL / functions apply cleanly
# (the transaction pooler on 6543 does NOT — avoid it for migrations).
# Until the secret is set, this workflow skips gracefully. It never runs on pull
# requests (only merged code applies).

on:
  push:
    branches: [main]
    paths:
      - 'db/**'
      - '.github/workflows/apply-migrations.yml'
  workflow_dispatch:
    inputs:
      file:
        description: 'A single db/ file to apply (e.g. problems-seed.sql). Blank = apply the full apply-order manifest.'
        required: false
        default: ''

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure psql
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice::SUPABASE_DB_URL secret not set — skipping. Add it in Settings → Secrets and variables → Actions to enable auto-apply."
            exit 0
          fi

          apply() {
            echo "== applying db/$1 =="
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "db/$1"
          }

          if [ -n "${INPUT_FILE:-}" ]; then
            if [ ! -f "db/$INPUT_FILE" ]; then echo "::error::db/$INPUT_FILE not found"; exit 1; fi
            apply "$INPUT_FILE"
          else
            while IFS= read -r line; do
              f="$(echo "$line" | sed 's/#.*//' | xargs || true)"   # strip comments/whitespace
              [ -z "$f" ] && continue
              apply "$f"
            done < db/apply-order.txt
          fi
          echo "✓ Migrations applied."
