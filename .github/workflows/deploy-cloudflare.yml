name: Deploy web to Cloudflare Pages

# The path OFF GitHub Pages so the repo can go PRIVATE (GitHub Pages requires a
# public repo on the free plan; Cloudflare Pages doesn't care).
#
# Setup (one-time, ~10 minutes — see HOSTING.md "Migrating to Cloudflare Pages"):
#   1. Create a free Cloudflare account → dash.cloudflare.com.
#   2. Create an API token: My Profile → API Tokens → Create Token →
#      "Edit Cloudflare Workers" template (or custom with Cloudflare Pages:Edit)
#      → copy the token.
#   3. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        CLOUDFLARE_API_TOKEN  = the token
#        CLOUDFLARE_ACCOUNT_ID = dash.cloudflare.com → right sidebar (or URL)
#   4. Re-run this workflow (Actions → Deploy web to Cloudflare Pages → Run).
#      First run creates the "sparx-app" Pages project; the site comes up at
#      https://sparx-app.pages.dev (custom domain attachable in the CF dash).
#   5. Supabase dashboard → Auth → URL Configuration → add the new origin(s)
#      to the Redirect URLs — BEFORE pointing users at it, or sign-in breaks.
#   6. Verify the site, then: repo Settings → Danger Zone → make repo private.
#      (GitHub Pages stops; this workflow keeps deploying.)
#
# Until the two secrets exist this workflow skips gracefully — safe to merge now.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping. See the setup steps in this workflow file."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Export web build (root-served — no base path)
        if: steps.gate.outputs.ready == 'true'
        run: npx expo export --platform web
        env:
          # Cloudflare serves at the domain root, unlike GitHub Pages' subpath —
          # EXPO_PUBLIC_BASE_URL deliberately unset.
          EXPO_PUBLIC_SPARKY_WEBHOOK: ${{ vars.SPARKY_WEBHOOK }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: SPA fallback (client-side routing on deep links)
        if: steps.gate.outputs.ready == 'true'
        run: cp dist/index.html dist/404.html

      - name: Ensure Pages project exists
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create sparx-app --production-branch=main 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=sparx-app --branch=main
